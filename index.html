<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Velazquez Lawn Service — mowing, landscaping, cleanup, and trimming across North Houston & Montgomery County. Free estimates, fully insured, 15+ years experience."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Velazquez Lawn Service — Maintenance &amp; Landscape</title>
  </head>
  <body>
    <!--
      Static copy of the contact form so Netlify's build-time HTML parser can
      register it. The real form lives in src/components/ContactForm.jsx and is
      client-rendered, which the parser never sees. Field names must stay in sync.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="contactName" />
      <input type="email" name="contactEmail" />
      <input type="tel" name="contactPhone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
